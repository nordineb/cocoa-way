# ABOUTME: CI pipeline for cocoa-way Rust macOS Wayland compositor.
# ABOUTME: Uses Nix flake devShell for reproducible builds, runs justfile recipes.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint commit messages
        # PIN THIS SHA before merging — use: gh api repos/wagoid/commitlint-github-action/git/refs/tags/v6
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml

  ci:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          prefix-key: ${{ github.ref }}

      - name: Run CI checks
        run: nix develop --command just ci
