# ABOUTME: cargo-deny configuration for cocoa-way dependency policy enforcement.
# ABOUTME: Defines rules for advisories, licenses, bans, and crate sources.

[advisories]
# vulnerabilities are denied by default in cargo-deny 0.16+
# unmaintained takes a scope: "all" | "workspace" | "transitive" | "none"
unmaintained = "none"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "GPL-3.0-only",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
