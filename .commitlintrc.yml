# ABOUTME: Commitlint configuration for conventional commit enforcement in CI.
# ABOUTME: Mirrors the types enforced by the local pre-commit hook.

extends:
  - '@commitlint/config-conventional'

rules:
  type-enum:
    - 2
    - always
    - - feat
      - fix
      - docs
      - style
      - refactor
      - perf
      - test
      - build
      - ci
      - chore
      - revert
  subject-case:
    - 2
    - always
    - lower-case
  header-max-length:
    - 2
    - always
    - 100
